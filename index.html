Pero<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Sensi Z | Free Fire</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

:root {
  --neon: #39ff14;
  --green: #00ff88;
  --bg: #050807;
  --card: #0b1210;
  --text: #effff3;
  --muted: #82958a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
  background:
    radial-gradient(ellipse at 50% 0%, #10321b 0%, transparent 43%),
    var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  opacity: .14;
  background-image:
    linear-gradient(#39ff1410 1px, transparent 1px),
    linear-gradient(90deg, #39ff1410 1px, transparent 1px);
  background-size: 35px 35px;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 7%;
  background: #050807eF;
  border-bottom: 1px solid #39ff1433;
  backdrop-filter: blur(16px);
}

.logo {
  font: 900 25px 'Orbitron', sans-serif;
  color: var(--neon);
  letter-spacing: 2px;
  text-shadow: 0 0 18px #39ff1480;
  animation: logoPulse 3s infinite;
}

.logo span { color: white; }

.header-tag {
  font-size: 13px;
  color: var(--green);
  letter-spacing: 2px;
}

main {
  width: min(950px, 92%);
  margin: auto;
}

.hero {
  text-align: center;
  padding: 65px 0 35px;
  animation: appear .8s ease both;
}

.pill {
  display: inline-block;
  border: 1px solid #39ff1460;
  color: var(--neon);
  background: #39ff140b;
  border-radius: 30px;
  padding: 7px 16px;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 22px;
}

h1 {
  font: 900 clamp(36px, 8vw, 72px) 'Orbitron', sans-serif;
  line-height: 1.15;
  letter-spacing: -2px;
}

h1 span {
  color: var(--neon);
  text-shadow: 0 0 30px #39ff1455;
}

.hero p {
  max-width: 520px;
  margin: 18px auto 0;
  color: #a6b8ad;
  font-size: 19px;
}

.stats {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.stat {
  border: 1px solid #39ff142b;
  background: #0b1210b0;
  border-radius: 10px;
  padding: 9px 17px;
  color: #c8d9cd;
  font-size: 14px;
}

.stat strong { color: var(--neon); }

.panel {
  background: linear-gradient(145deg, #101a14, #080d0b);
  border: 1px solid #39ff1445;
  border-radius: 20px;
  padding: clamp(18px, 4vw, 32px);
  margin: 25px 0;
  box-shadow: 0 0 45px #39ff1408;
  animation: appear .8s ease both;
}

.section-title {
  font: 700 18px 'Orbitron', sans-serif;
  margin-bottom: 20px;
}

.section-title span { color: var(--neon); }

label {
  display: block;
  color: #c1d1c6;
  font-size: 16px;
  margin-bottom: 8px;
}

.search-wrap { position: relative; }

.search-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  pointer-events: none;
}

input, select {
  width: 100%;
  background: #050907;
  color: white;
  border: 1px solid #304637;
  border-radius: 10px;
  padding: 14px;
  font: 500 17px 'Rajdhani', sans-serif;
  outline: none;
  transition: .25s;
}

input { padding-left: 45px; }

input:focus, select:focus {
  border-color: var(--neon);
  box-shadow: 0 0 14px #39ff1420;
}

select { cursor: pointer; }
select option { background: #0b1210; }

.device-results {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  max-height: 280px;
  overflow-y: auto;
  padding-right: 4px;
}

.device-results::-webkit-scrollbar { width: 6px; }
.device-results::-webkit-scrollbar-track { background: #080e0a; }
.device-results::-webkit-scrollbar-thumb { background: #263c2c; border-radius: 10px; }
.device-results::-webkit-scrollbar-thumb:hover { background: var(--neon); }

.device {
  text-align: left;
  background: #101913;
  color: #cbd8ce;
  border: 1px solid #263c2c;
  border-radius: 9px;
  padding: 12px;
  font: 600 15px 'Rajdhani', sans-serif;
  cursor: pointer;
  transition: transform .25s, border-color .25s, color .25s, background .25s;
  overflow-wrap: anywhere;
}

.device:hover {
  transform: translateY(-2px);
  border-color: var(--neon);
  color: var(--neon);
  background: #14231a;
  box-shadow: 0 0 15px #39ff1418;
}

.device.active {
  border-color: var(--neon);
  color: var(--neon);
  background: #17321b;
  box-shadow: inset 0 0 15px #39ff1410;
}

.empty {
  color: #a6b8ad;
  grid-column: 1 / -1;
  padding: 15px 0;
}

.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 22px;
}

.dpi-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.dpi-option {
  background: #080e0a;
  color: #b8c8bc;
  border: 1px solid #304637;
  border-radius: 10px;
  padding: 14px 8px;
  cursor: pointer;
  font: 700 16px 'Rajdhani', sans-serif;
  transition: .25s;
}

.dpi-option:hover { border-color: var(--green); }

.dpi-option.active {
  background: #15351d;
  color: var(--neon);
  border-color: var(--neon);
  box-shadow: 0 0 15px #39ff141a;
}

.primary-btn {
  width: 100%;
  margin-top: 25px;
  border: 1px solid var(--neon);
  border-radius: 10px;
  padding: 17px;
  color: #031006;
  background: var(--neon);
  font: 900 16px 'Orbitron', sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 0 22px #39ff1425;
  transition: transform .2s, box-shadow .2s, background .2s;
}

.primary-btn:hover {
  transform: translateY(-3px);
  background: #75ff5d;
  box-shadow: 0 0 32px #39ff1460;
}

.primary-btn:active { transform: scale(.97); }

.result {
  display: none;
}

.result.show {
  display: block;
  animation: appear .55s ease both;
}

.result-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.result-heading h2 {
  font: 700 19px 'Orbitron', sans-serif;
  color: var(--neon);
}

.tag {
  border: 1px solid #39ff1455;
  color: var(--neon);
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.result-device {
  color: #c0d2c5;
  margin-bottom: 20px;
  font-size: 17px;
}

.sensi-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.sensi-card {
  border: 1px solid #253c2b;
  border-radius: 12px;
  background: #070c09;
  padding: 17px;
  transition: .25s;
}

.sensi-card:hover {
  border-color: #39ff1480;
  transform: translateY(-2px);
}

.sensi-card span {
  color: #a1b4a6;
  font-size: 15px;
}

.sensi-card strong {
  display: block;
  color: var(--neon);
  font: 800 clamp(24px, 5vw, 34px) 'Orbitron', sans-serif;
  margin-top: 10px;
  animation: numberIn .4s ease both;
}

.dpi-box {
  display: none;
  margin-top: 12px;
  padding: 18px;
  background: #14291a;
  border: 1px solid #39ff1455;
  border-radius: 12px;
}

.dpi-box.show {
  display: block;
  animation: appear .4s ease;
}

.dpi-box strong {
  color: var(--neon);
  font: 800 27px 'Orbitron', sans-serif;
}

.dpi-box p {
  color: #a6b8ad;
  font-size: 14px;
  margin-top: 6px;
}

.note {
  color: #839789;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 18px;
}

.secondary-btn {
  width: 100%;
  background: transparent;
  border: 1px solid #39ff1470;
  border-radius: 10px;
  color: var(--neon);
  padding: 14px;
  margin-top: 12px;
  font: 700 14px 'Orbitron', sans-serif;
  cursor: pointer;
  transition: .25s;
}

.secondary-btn:hover {
  background: #39ff1418;
  box-shadow: 0 0 20px #39ff1420;
  transform: translateY(-2px);
}

footer {
  margin-top: 55px;
  padding: 40px 20px;
  text-align: center;
  border-top: 1px solid #39ff142b;
  background: #030605;
}

.footer-logo {
  font: 900 24px 'Orbitron', sans-serif;
  color: var(--neon);
}

.slogan {
  font: 700 clamp(17px, 4vw, 23px) 'Orbitron', sans-serif;
  margin-top: 15px;
  color: white;
}

.slogan span { color: var(--neon); }

footer p {
  margin-top: 15px;
  color: #718578;
  font-size: 14px;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes numberIn {
  from { opacity: 0; transform: scale(.8); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes logoPulse {
  0%, 100% { text-shadow: 0 0 10px #39ff1440; }
  50% { text-shadow: 0 0 23px #39ff1490; }
}

@media (max-width: 540px) {
  header { padding: 14px 5%; }
  .logo { font-size: 21px; }
  .header-tag { font-size: 10px; }
  .hero { padding-top: 48px; }
  .field-grid { grid-template-columns: 1fr; gap: 12px; }
  .sensi-grid { gap: 9px; }
  .sensi-card { padding: 13px; }
}
</style>
</head>

  <div class="logo">SENSI <span>Z</span></div>

</header>
